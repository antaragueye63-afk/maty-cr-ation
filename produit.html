<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Produit — Maty Création</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="header">

   
   <a href="index.html" class="logo">
    <img src="images/logo.png" alt="Maty Création">
</a>

    <nav class="nav">

        <a href="index.html">Accueil</a>

        <a href="boutique.html">Boutique</a>

        <a href="sur-mesure.html">Sur mesure</a>

        <a href="apropos.html">À propos</a>

        <a href="contact.html">Contact</a>

    </nav>

    <a href="panier.html" class="cart">
        Panier <span id="cart-count">0</span>
    </a>

</header>


<main>

<section class="product-page">

    <div class="product-large-image">

        <img
            src="images/robe1.jpg"
            alt="Robe Élégance">

    </div>


    <div class="product-details">

        <p class="small-title">
            COLLECTION FEMME
        </p>

        <h1>
            Robe <em>Élégance</em>
        </h1>

        <strong class="price">
            45 000 FCFA
        </strong>

        <p>
            Une création élégante conçue avec des matières
            soigneusement sélectionnées.
        </p>


        <label>
            Taille
        </label>

        <select>

            <option>Choisir une taille</option>
            <option>XS</option>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>

        </select>


        <button
            class="btn add-cart"
            data-name="Robe Élégance"
            data-price="45000">

            Ajouter au panier

        </button>

    </div>

</section>

</main>


<script src="js/script.js"></script>

</body>
</html>
